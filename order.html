<!DOCTYPE html>
<html>
<head>
<title>Order</title>
</head>

<body>

<h1>Place Order</h1>

<form method="POST">

{% csrf_token %}

<input
type="text"
name="customer"
placeholder="Customer Name"
required>

<br><br>

<input
type="text"
name="item"
placeholder="Food Item"
required>

<br><br>

<input
type="number"
name="qty"
placeholder="Quantity"
required>

<br><br>

<button type="submit">

Place Order

</button>

</form>

</body>
</html>
